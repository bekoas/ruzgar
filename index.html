<html lang="tr">

<title>R&#xFC;zgar</title>

<style>
:root{--zemin:#14131f;--kart:rgba(255,255,255,.06);--kenar:rgba(255,255,255,.09);--yazi:#ecebf3;--soluk:#a19fb6;
  --mavi:#78bfff;--lila:#b8a3f0;--pembe:#f5a6bd;--sari:#f5cc59;--murekkep:#0d1421;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--zemin);color:var(--yazi);font:15px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:10px;padding:12px max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left))}
#ad{font-weight:650;font-size:17px;letter-spacing:.2px}
#durum{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--soluk)}
#nokta{width:7px;height:7px;border-radius:50%;background:#5bd68a}
#ajanlar{margin-left:auto;display:flex;gap:4px}
#ajanlar canvas{image-rendering:pixelated;opacity:.35;filter:saturate(.2);transition:.25s}
#ajanlar canvas.aktif{opacity:1;filter:none;transform:translateY(-2px)}
#sahne{position:relative;height:92px;margin:0 12px;border-radius:16px;overflow:hidden;background:linear-gradient(#211e3b,#45385f)}
#sahne canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
main{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}
.m{max-width:84%;padding:10px 14px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.ben{align-self:flex-end;background:linear-gradient(135deg,var(--mavi),var(--lila));color:var(--murekkep);border-bottom-right-radius:6px}
.o{align-self:flex-start;background:var(--kart);border:1px solid var(--kenar);border-bottom-left-radius:6px}
.o.hata{border-color:rgba(245,166,189,.5)}
.m img{display:block;max-width:100%;border-radius:12px;margin-top:6px}
.kaynak{font-size:11px;opacity:.6;margin-bottom:2px}
.yaziyor span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--lila);animation:z 1s infinite}
.yaziyor span:nth-child(2){animation-delay:.15s;background:var(--mavi)}.yaziyor span:nth-child(3){animation-delay:.3s;background:var(--pembe)}
@keyframes z{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-4px);opacity:1}}
#ekler{display:flex;gap:8px;padding:0 16px;overflow-x:auto}
#ekler div{position:relative;flex:none}
#ekler img{height:62px;border-radius:10px;display:block}
#ekler .belge{height:62px;max-width:150px;padding:8px 10px;border-radius:10px;background:var(--kart);border:1px solid var(--kenar);font-size:12px;display:flex;align-items:center;gap:6px;overflow:hidden;word-break:break-all}
.eylem{border:1px solid var(--lila)!important}
.eylem .tus{display:flex;gap:8px;margin-top:10px}
.eylem .tus button{flex:1;padding:9px;border-radius:18px;border:0;font:inherit;font-weight:650}
.eylem .tus .evet{background:linear-gradient(135deg,var(--mavi),var(--lila));color:var(--murekkep)}
.eylem .tus .hayir{background:var(--kart);color:var(--soluk);border:1px solid var(--kenar)}
#ekler button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:#000a;color:#fff;font-size:13px}
form{display:flex;align-items:flex-end;gap:8px;padding:10px max(16px,env(safe-area-inset-right)) 14px max(16px,env(safe-area-inset-left))}
.dgm{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--kenar);background:var(--kart);color:var(--soluk);display:grid;place-items:center;font-size:18px}
textarea{flex:1;min-width:0;resize:none;max-height:140px;padding:10px 14px;border-radius:20px;border:1px solid var(--kenar);background:var(--kart);color:var(--yazi);font:inherit;outline:none}
textarea:focus{border-color:rgba(120,191,255,.6)}
#gonder{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--mavi),var(--lila));color:var(--murekkep);font-size:19px;font-weight:700;box-shadow:0 2px 10px rgba(120,191,255,.35)}
#gonder:disabled{opacity:.5}
#esles{flex:1;display:grid;place-items:center;text-align:center;padding:24px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left))}
#esles h1{font-size:22px;margin:.6em 0 .3em;text-wrap:balance}
#esles p{color:var(--soluk);max-width:32ch;margin:0 auto}
.gizli{display:none!important}
</style>
</head>

  try {
    const ekler = [];
    for (const [i, f] of fotolar.entries()) ekler.push({ url: await dosyaYukle(new Uint8Array(await f.blob.arrayBuffer())), ad: f.belge ? f.ad : `foto${i + 1}.jpg` });
    await gonderMac({ tip: "mesaj", metin, ekler });
    const belgeAdlari = fotolar.filter(f => f.belge).map(f => "\u{1f4ce} " + f.ad).join("\n");
    ekle({ ben: true, metin: [metin, belgeAdlari].filter(Boolean).join("\n") || "(foto\u011fraf)", fotolar: fotolar.filter(f => !f.belge).map(f => f.url) });
    $("#yazi").value = ""; $("#yazi").style.height = "auto"; fotolar = []; ekleriCiz();
    bekleyen = true; mod("busy"); yaziyorGoster(true); durumYaz("Mac'e gitti, bekliyorum\u2026", "#f5cc59");
  } catch (err) { durumYaz("g\u00f6nderilemedi: internet?", "#f5a6bd") }
  $("#gonder").disabled = false;
};

// ---------- piksel karakter + sahne (Mac'teki balonun ayn\u0131s\u0131) ----------
let ROBOT = al("robot", VARSAYILAN_ROBOT), AJAN = al("ajan", VARSAYILAN_AJAN), durumMod = "idle", kare = 0;
const renk = p => p ? `rgb(${p[0]},${p[1]},${p[2]})` : null;
function duvarRengi(gx, gy, wt) {
  if (gy === wt) return "u"; if (gy === wt + 1) return "v";
  const row = gy - wt - 2, r = row % 3; if (r === 2) return "m";
  const off = Math.floor(row / 3) % 2 === 1 ? 3 : 0, m = (((gx + off) % 6) + 6) % 6, blk = Math.floor((gx + off) / 6);
  return m === 5 ? "m" : ((((blk + Math.floor(row / 3)) % 2) + 2) % 2 === 1 ? "b" : "c");
}
function mod(m) { durumMod = m; kare = 0 }
function sahneCiz() {
  const c = $("#sahneTuval"), r = c.getBoundingClientRect(), px = 3;
  const W = Math.floor(r.width / px), H = Math.floor(r.height / px); if (c.width !== W) { c.width = W; c.height = H }
  const x = c.getContext("2d"); x.clearRect(0, 0, W, H);
  const duvarUst = H - 7, pal = ROBOT ? ROBOT.pal : {};
  // y\u0131ld\u0131zlar
  for (let i = 0; i < 18; i++) { const sx = (i * 37 + 11) % W, sy = (i * 17 + 3) % Math.max(1, duvarUst - 2);
    if ((i + Math.floor(Date.now() / 900)) % 5) { x.fillStyle = i % 3 ? "#cfd8ff" : "#f5cc59"; x.fillRect(sx, sy, 1, 1) } }
  // duvar
  for (let gy = duvarUst; gy < H; gy++) for (let gx = 0; gx < W; gx++) { const k = renk(pal[duvarRengi(gx, gy - duvarUst + 23, 23)]); if (k) { x.fillStyle = k; x.fillRect(gx, gy, 1, 1) } }
  // sarma\u015f\u0131k
  for (let v = 0; v < 5; v++) { const vx = 6 + v * 19, ln = 2 + (v * 7) % 4;
    for (let k = 0; k < ln; k++) { x.fillStyle = renk(pal[k % 3 ? "L" : "l"]) || "#6b9"; x.fillRect(vx + (k % 2), duvarUst + 1 + k, 1, 1) }
    x.fillStyle = renk(pal.F) || "#f9b"; x.fillRect(vx, duvarUst + 1 + ln, 1, 1) }
  // robot (duvar sat\u0131r\u0131 23 sahnedeki duvar\u0131n \u00fcst\u00fcne)
  if (ROBOT) { const set = ROBOT[durumMod] || ROBOT.idle, f = set[kare % set.length], ox = W - ROBOT.w - 4, oy = duvarUst - 23;
    f.forEach((row, yy) => [...row].forEach((ch, xx) => { const k = renk(pal[ch]); if (k) { x.fillStyle = k; x.fillRect(ox + xx, oy + yy, 1, 1) } })) }
}
function tekCiz(tuval, set) {
  if (!ROBOT) return; const x = tuval.getContext("2d"), f = (ROBOT[set] || ROBOT.idle)[kare % (ROBOT[set] || ROBOT.idle).length];
  tuval.width = ROBOT.w; tuval.height = ROBOT.h; f.forEach((row, yy) => [...row].forEach((ch, xx) => { const k = renk(ROBOT.pal[ch]); if (k) { x.fillStyle = k; x.fillRect(xx, yy, 1, 1) } }));
}
function ajanCiz() {
  const k = $("#ajanlar"); k.textContent = ""; if (!AJAN) return;
  ["kurgu", "ses", "arastirma", "tasarim"].forEach(ad => { const s = (AJAN.ajanlar || {})[ad]; if (!s) return;
    const c = document.createElement("canvas"); c.width = s[0].length; c.height = s.length; c.style.width = (s[0].length * 0.65) + "px"; c.dataset.ad = ad;
    const x = c.getContext("2d"); s.forEach((row, yy) => [...row].forEach((ch, xx) => { const p = AJAN.pal[ch]; if (p) { x.fillStyle = renk(p); x.fillRect(xx, yy, 1, 1) } }));
    k.append(c) });
}
setInterval(() => { kare++; if (!AYAR) tekCiz($("#eslesRobot"), "idle"); else sahneCiz() }, 180);

// ---------- Android uygulamasi (APK) icindeyse ----------
const ANDROID = window.RuzgarAndroid || null;
let sesliMod = false;
// markdown/emoji temizle: sesli okunacak duz metin
function sesleOkunur(t) { return String(t).replace(/```[\s\S]*?```/g, " kod blo\u011fu ").replace(/[*_#`>|~\[\]()]/g, " ").replace(/https?:\/\/\S+/g, " ba\u011flant\u0131 ").replace(/\s+/g, " ").trim().slice(0, 1200) }
// ---------- telefonda i\u015f (R\u00fczgar \u00f6nerir, Beko onaylar) ----------
// Mac'teki R\u00fczgar cevab\u0131n sonuna [[telefon:{...}]] ekler; burada onay kart\u0131 olur, Onayla'ya basmadan hi\u00e7bir \u015fey yap\u0131lmaz.
function eylemAyikla(t) {
  const eylemler = [];
  const metin = String(t).replace(/\[\[telefon:\s*(\{[\s\S]*?\})\s*\]\]/g, (_, j) => { try { eylemler.push(JSON.parse(j)) } catch (e) {} return "" }).trim();
  return { metin, eylemler };
}
const iki = n => String(n).padStart(2, "0");
function eylemYazi(o) {
  switch (o.tip) {
    case "alarm": return `\u23f0 Alarm kur: ${iki(o.saat ?? 0)}:${iki(o.dakika ?? 0)}${o.etiket ? " \u00b7 " + o.etiket : ""}`;
    case "zamanlayici": { const s = +o.saniye || 0; return `\u23f1 Zamanlay\u0131c\u0131: ${s >= 60 ? Math.round(s / 60) + " dakika" : s + " saniye"}${o.etiket ? " \u00b7 " + o.etiket : ""}` }
    case "ara": return `\u{1f4de} Ara: ${o.kisi || o.numara}`;
    case "sms": return `\u{1f4ac} Mesaj yaz: ${o.kisi || o.numara} \u00b7 \u201c${o.metin || ""}\u201d`;
    case "harita": return `\u{1f5fa} Haritada g\u00f6ster: ${o.yer}`;
    case "yol": return `\u{1f9ed} Yol tarifi: ${o.yer}`;
    case "uygulama": return `\u{1f4f1} Uygulamay\u0131 a\u00e7: ${o.ad}`;
    case "web": return `\u{1f310} Sayfay\u0131 a\u00e7: ${o.url}`;
    case "takvim": return `\u{1f4c5} Takvime ekle: ${o.baslik}${o.zaman ? " \u00b7 " + String(o.zaman).replace("T", " ").slice(0, 16) : ""}`;
    case "ayar": return `\u2699\ufe0f Ayar\u0131 a\u00e7: ${o.ne || "ayarlar"}`;
    default: return "\u2753 " + JSON.stringify(o);
  }
}
let bekleyenEylem = null;
function eylemKarti(o) {
  const d = document.createElement("div"); d.className = "m o eylem";
  const y = document.createElement("div"); y.textContent = eylemYazi(o);
  const tus = document.createElement("div"); tus.className = "tus";
  const evet = document.createElement("button"); evet.className = "evet"; evet.type = "button"; evet.textContent = "\u2714 Onayla";
  const hayir = document.createElement("button"); hayir.className = "hayir"; hayir.type = "button"; hayir.textContent = "Vazge\u00e7";
  tus.append(evet, hayir); d.append(y, tus); $("#akis").append(d); asagi();
  const kart = { o, d, bitir: sonuc => { tus.remove(); const s = document.createElement("div"); s.style.cssText = "margin-top:8px;color:var(--soluk);font-size:13px"; s.textContent = sonuc; d.append(s); if (bekleyenEylem === kart) bekleyenEylem = null; asagi() } };
  evet.onclick = () => eylemYap(kart);
  hayir.onclick = () => kart.bitir("\u2715 Vazge\u00e7ildi");
  kart.zaman = Date.now(); bekleyenEylem = kart;
}
function eylemYap(kart, sesli) {
  if (!ANDROID || !ANDROID.eylem) { kart.bitir("Bu i\u015f yaln\u0131z R\u00fczgar uygulamas\u0131nda (APK) yap\u0131l\u0131r"); return }
  let s = ""; try { s = ANDROID.eylem(JSON.stringify(kart.o)) } catch (e) { s = "Yapamad\u0131m" }
  kart.bitir("\u2714 " + s);
  if (sesli && ANDROID.oku) ANDROID.oku(s);
}
const EVET = /^(evet|onayl[\u0131i]yorum|onayla|yap|olur|tamam yap|kur|ara|g\u00f6nder|a\u00e7)(\s|[.!,]|$)/i, HAYIR = /^(hay\u0131r|hayir|vazge\u00e7|vazgec|iptal|yapma|bo\u015fver)(\s|[.!,]|$)/i;
// APK sesi yaziya cevirince buraya gelir: dogrudan gonder, cevabi sesli oku
window.sesliGonder = t => {
  t = String(t || "").trim(); if (!t) return;
  if (bekleyenEylem && Date.now() - bekleyenEylem.zaman > 120000) bekleyenEylem = null;
  if (bekleyenEylem && EVET.test(t)) { eylemYap(bekleyenEylem, true); return }
  if (bekleyenEylem && HAYIR.test(t)) { bekleyenEylem.bitir("\u2715 Vazge\u00e7ildi"); if (ANDROID && ANDROID.oku) ANDROID.oku("Tamam, vazge\u00e7tim."); return }
  sesliMod = true; $("#yazi").value = t; $("#form").requestSubmit();
};
if (ANDROID && ANDROID.dinle) { const m = $("#mikDugme"); m.classList.remove("gizli"); m.onclick = () => ANDROID.dinle() }
if (ANDROID) {
  const q = $("#qrDugme"); q.classList.remove("gizli"); q.onclick = () => ANDROID.qrOkut();
  const b = $("#balonDugme"); b.classList.remove("gizli");
  const boya = () => { const ac = ANDROID.balonDurum(); b.style.opacity = ac ? 1 : .45; b.title = ac ? "Y\u00fczen balon a\u00e7\u0131k (dokun: kapat)" : "Y\u00fczen balon kapal\u0131 (dokun: a\u00e7)" };
  b.onclick = () => { ANDROID.balon(!ANDROID.balonDurum()); setTimeout(boya, 400) }; boya();
  document.addEventListener("visibilitychange", () => { if (!document.hidden) boya() });
}

// ---------- ba\u015flat ----------
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
(async () => {
  if (!AYAR) { ["#ust", "#sahne", "#akis", "#ekler", "#form"].forEach(s => $(s).classList.add("gizli")); $("#esles").classList.remove("gizli"); return }
  ayarUygula({ ad: al("ad", "R\u00fczgar") }); ajanCiz(); hepsiniCiz();
  await anahtarHazirla(); dinle();
  try {
    await gonderMac({ tip: "ping" }); await gonderMac({ tip: "gecmis" });
    if (Date.now() - al("karakterTarih", 0) > 864e5 || !al("robot", null)) await gonderMac({ tip: "karakter" });
  } catch (e) { durumYaz("internet yok", "#f5a6bd") }
})();
document.addEventListener("visibilitychange", () => { if (!document.hidden && AYAR && anahtar) gonderMac({ tip: "ping" }).catch(() => {}) });
</script>
